<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terima Kasih - LEPTEK</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            position: relative;
        }

        /* Tombol Back Panah (same as peserta_daftar.php) */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-back:hover {
            background: #00e5ff;
            color: #090a16;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .btn-back svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Container (same card as peserta_daftar.php) */
        .container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 35px 28px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            position: relative;
            margin-top: 40px; /* room for the back button on mobile */
            text-align: center;
        }

        /* Green check circle */
        .check-circle {
            width: 84px;
            height: 84px;
            margin: 0 auto 22px;
            background: #2ecc71;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .check-circle svg {
            width: 44px;
            height: 44px;
            fill: #ffffff;
        }

        h1 {
            text-align: center;
            color: #1a1c35;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .thankyou-text {
            color: #333333;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .thankyou-note {
            color: #777777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Cyan button (same look as "Daftar Sekarang") */
        .btn-kembali {
            display: inline-block;
            padding: 14px 32px;
            background-color: #00e5ff;
            color: #090a16;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        .btn-kembali:hover {
            background-color: #00b3cc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
        }

        /* Penyesuaian Media Query untuk Desktop (Layar >= 640px) */
        @media (min-width: 640px) {
            body {
                padding: 40px;
            }

            .container {
                padding: 45px 50px;
                margin-top: 0;
            }

            .btn-back {
                position: fixed;
                top: 24px;
                left: 24px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- Tombol Back Icon -->
    <a href="../index.php" class="btn-back" title="Kembali ke Beranda">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
    </a>

    <div class="container">
        <div class="check-circle">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>

        <h1>Terima Kasih!</h1>
        <p class="thankyou-text">
            Terimakasih telah mengisi formulir pendaftaran kami. Kami akan
            segera menghubungi anda lagi.
        </p>
        <p class="thankyou-note">
            Pantau WhatsApp dan email Anda untuk informasi pendaftaran
            selanjutnya dari panitia LEPTEK.
        </p>

        <a href="../index.php" class="btn-kembali">Kembali ke Beranda</a>
    </div>
</body>
</html>
